version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bgm-postgres
    environment:
      POSTGRES_USER: bgm_user
      POSTGRES_PASSWORD: bgm_password
      POSTGRES_DB: boardgamemanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgm_user -d boardgamemanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bgm-backend
    environment:
      DATABASE_URL: postgresql://bgm_user:bgm_password@postgres:5432/boardgamemanager
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bgm-frontend
    environment:
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
