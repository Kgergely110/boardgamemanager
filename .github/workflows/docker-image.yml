name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build ./${{ matrix.component }} --tag my-image-name:$(date +%s)
